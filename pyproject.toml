[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hatari"
version = "0.1.0"
description = "Detection and explanation of fraudulent text messages"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
]

[project.optional-dependencies]
api = ["fastapi==0.115.6", "uvicorn==0.32.1"]
app = ["streamlit==1.40.2", "plotly==5.24.1"]
dev = ["pytest==8.3.3", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
