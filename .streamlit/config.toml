[theme]
base = "dark"
primaryColor = "#E2692B"
backgroundColor = "#0F1B2D"
secondaryBackgroundColor = "#16263D"
textColor = "#E8EDF5"
font = "sans serif"

[browser]
gatherUsageStats = false
# Local address only. It also stops Streamlit from querying an external service for the public IP,
# which failed on some networks and is not wanted for an offline demonstration.
serverAddress = "localhost"

[server]
headless = true

[client]
toolbarMode = "minimal"
